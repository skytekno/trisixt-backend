name: Publish container
on:
  workflow_call:
    inputs:
      tag:
        required: true
        type: string
      sha:
        required: true
        type: string
  workflow_dispatch:
    inputs:
      tag:
        description: Existing release tag to publish or retry
        required: true
        type: string
      sha:
        description: Full commit SHA of that release
        required: true
        type: string
permissions:
  contents: read
  packages: write
concurrency:
  group: container-publication
  cancel-in-progress: false
jobs:
  publish:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ inputs.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Verify immutable release identity
        id: meta
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.tag }}
          RELEASE_SHA: ${{ inputs.sha }}
        run: |
          python3 - <<'PYCODE'
          import json, os, re, subprocess, tomllib
          tag, sha = os.environ['RELEASE_TAG'], os.environ['RELEASE_SHA']
          assert re.fullmatch(r'v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)', tag)
          assert re.fullmatch(r'[0-9a-f]{40}', sha)
          def git(*args):
              return subprocess.check_output(['git', *args], text=True).strip()
          assert git('rev-parse', 'HEAD') == sha
          assert git('rev-parse', 'refs/tags/' + tag + '^{commit}') == sha
          subprocess.run(['git', 'merge-base', '--is-ancestor', sha, 'origin/main'], check=True)
          with open('Cargo.toml', 'rb') as source:
              assert tomllib.load(source)['package']['version'] == tag[1:]
          repo = os.environ['GITHUB_REPOSITORY']
          release = json.loads(subprocess.check_output(['gh', 'api', f'repos/{repo}/releases/tags/{tag}']))
          assert not release['draft'] and not release['prerelease']
          image = 'ghcr.io/' + repo.lower()
          with open(os.environ['GITHUB_OUTPUT'], 'a') as output:
              output.write(f'image={image}\n')
          PYCODE
      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Reuse an already published version on retries
        id: existing
        env:
          IMAGE: ${{ steps.meta.outputs.image }}
          TAG: ${{ inputs.tag }}
          SHA: ${{ inputs.sha }}
        run: |
          if docker manifest inspect "$IMAGE:$TAG" > /tmp/existing-image.json 2>/tmp/manifest-error; then
            docker pull "$IMAGE:$TAG"
            revision=$(docker inspect --format '{{ index .Config.Labels "org.opencontainers.image.revision" }}' "$IMAGE:$TAG")
            [[ "$revision" == "$SHA" ]]
            echo 'exists=true' >> "$GITHUB_OUTPUT"
          elif grep -Eq 'manifest unknown|no such manifest|not found' /tmp/manifest-error; then
            echo 'exists=false' >> "$GITHUB_OUTPUT"
          else
            cat /tmp/manifest-error >&2
            exit 1
          fi
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
      - name: Build the exact image to be tested and published
        if: steps.existing.outputs.exists != 'true'
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          load: true
          platforms: linux/amd64
          tags: ${{ steps.meta.outputs.image }}:${{ inputs.tag }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ inputs.sha }}
            org.opencontainers.image.version=${{ inputs.tag }}
          cache-from: type=gha,scope=trisixt-release
          cache-to: type=gha,mode=max,scope=trisixt-release
      - name: Smoke-test the release image
        env:
          IMAGE_NAME: ${{ steps.meta.outputs.image }}:${{ inputs.tag }}
        run: scripts/image-smoke.sh
      - name: Publish the tested image
        env:
          IMAGE: ${{ steps.meta.outputs.image }}
          TAG: ${{ inputs.tag }}
          GH_TOKEN: ${{ github.token }}
          EXISTS: ${{ steps.existing.outputs.exists }}
        run: |
          if [[ "$EXISTS" != true ]]; then
            docker push "$IMAGE:$TAG"
          fi
          latest=$(gh api "repos/$GITHUB_REPOSITORY/releases/latest" --jq .tag_name)
          if [[ "$latest" == "$TAG" ]]; then
            docker tag "$IMAGE:$TAG" "$IMAGE:latest"
            docker push "$IMAGE:latest"
          fi
