[package]
name = "trisixt"
version = "0.1.0"
edition = "2024"
rust-version = "1.98.1"
description = "Trisixt — self-hostable deep linking, attribution, and analytics platform"
license = "MIT"

[dependencies]
axum = "0.8"
tokio = { version = "1", features = ["full"] }
tower-http = { version = "0.6", features = ["trace", "request-id", "cors"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sqlx = { version = "0.9", default-features = false, features = ["runtime-tokio", "tls-rustls", "postgres", "chrono", "uuid", "json", "macros", "migrate"] }
uuid = { version = "1", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde"] }
thiserror = "2"
argon2 = "0.5"
sha2 = "0.10"
hex = "0.4"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
dotenvy = "0.15"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "http2"] }
object_store = { version = "0.14.2", features = ["aws", "gcp"] }
bytes = "1"
base64 = "0.22"
gcp_auth = "0.12"
redis = { version = "0.32", features = ["tokio-comp"] }
url = "2"
oauth2 = { version = "5", default-features = false, features = ["reqwest", "rustls-tls"] }
jsonwebtoken = { version = "10", default-features = false, features = ["aws_lc_rs", "use_pem"] }
hmac = "0.12"
sha1 = "0.10"
data-encoding = "2"
aes-gcm = "0.10"
x509-parser = { version = "0.18", features = ["verify"] }
lettre = { version = "0.11", default-features = false, features = ["builder", "smtp-transport", "tokio1-rustls", "ring", "webpki-roots"] }
qrcode = { version = "0.14", default-features = false, features = ["svg"] }
ammonia = "4"
hickory-resolver = "0.26.1"
psl = "2"
tower = { version = "0.5", features = ["util"] }
chrono-tz = "0.10"
csv = "1"
scraper = "0.27"

[dev-dependencies]
http-body-util = "0.1"
