name: trisixt-rewrite-test
services:
  postgres:
    image: postgres:18.6
    environment:
      POSTGRES_USER: trisixt
      POSTGRES_PASSWORD: trisixt
      POSTGRES_DB: trisixt_test
    ports: ["127.0.0.1:${TEST_POSTGRES_PORT:-55436}:5432"]
    tmpfs: [/var/lib/postgresql]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U trisixt -d trisixt_test"]
      interval: 2s
      timeout: 3s
      retries: 30
  redis:
    image: trisixt-redis:8.10.2
    build:
      context: .
      dockerfile: deploy/redis.Dockerfile
    command: ["redis-server", "--save", "", "--appendonly", "no", "--protected-mode", "no"]
    ports: ["127.0.0.1:${TEST_REDIS_PORT:-56386}:6379"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 2s
      timeout: 3s
      retries: 30
  clickhouse:
    image: clickhouse/clickhouse-server:25.3
    environment:
      CLICKHOUSE_DB: trisixt
      CLICKHOUSE_USER: trisixt
      CLICKHOUSE_PASSWORD: trisixt
      CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT: "1"
    ports: ["127.0.0.1:${TEST_CLICKHOUSE_PORT:-58123}:8123"]
    volumes:
      - ./deploy/clickhouse/001-events.sql:/docker-entrypoint-initdb.d/001-events.sql:ro
    healthcheck:
      test: ["CMD", "clickhouse-client", "--user", "trisixt", "--password", "trisixt", "--query", "SELECT 1"]
      interval: 2s
      timeout: 3s
      retries: 30
  minio:
    image: quay.io/minio/minio:RELEASE.2025-09-07T16-13-09Z
    command: ["server", "/data"]
    environment:
      MINIO_ROOT_USER: trisixt
      MINIO_ROOT_PASSWORD: trisixt-test-secret
    ports: ["127.0.0.1:${TEST_S3_PORT:-59000}:9000"]
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 2s
      timeout: 3s
      retries: 30
  minio-init:
    image: quay.io/minio/mc:RELEASE.2025-08-13T08-35-41Z
    depends_on:
      minio: {condition: service_healthy}
    entrypoint: ["/bin/sh", "-ec"]
    command: ["mc alias set local http://minio:9000 trisixt trisixt-test-secret && mc mb --ignore-existing local/trisixt"]
